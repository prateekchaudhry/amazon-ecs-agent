name: Auto Merge and Tag

# trigger: fire on pull request merged to dev. Narrowed down by if filter below.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read

jobs:
  # Decide whether this merge is a release promotion. This is a separate job so
  # that a branch which merely resembles a release branch produces a SKIPPED
  # promote job rather than a failed one.
  classify:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'v') &&
      endsWith(github.event.pull_request.head.ref, '-stage')
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      agent_version: ${{ steps.check.outputs.agent_version }}
    steps:
      - name: Classify the merged branch
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          AGENT_VERSION="${HEAD_REF#v}"
          AGENT_VERSION="${AGENT_VERSION%-stage}"
          if ! [[ "$AGENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Branch '${HEAD_REF}' does not name an X.Y.Z release. Nothing to promote."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Recognised release version ${AGENT_VERSION}"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "agent_version=${AGENT_VERSION}" >> "$GITHUB_OUTPUT"

  promote:
    needs: classify
    if: needs.classify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    env:
      AGENT_VERSION: ${{ needs.classify.outputs.agent_version }}
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # This must come before the checkout. The push to master has to carry the
      # app's credentials, because master restricts pushes to amazon-ecs-bot and
      # the default GITHUB_TOKEN is attributed to github-actions[bot], which is
      # not on that allowlist.
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # We only ever push and tag; no need for the app's pull-requests permission too.
          permission-contents: write

      # Fails the job unless amazon-ecs-prateek-bot opened this PR; swap the name here when this lands in the real repo.
      - name: Verify the pull request was opened by this repo's App
        env:
          ACTUAL_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          EXPECTED_LOGIN="amazon-ecs-prateek-bot[bot]"
          if [[ "$ACTUAL_LOGIN" != "$EXPECTED_LOGIN" ]]; then
            echo "::error::Release pull request was opened by ${ACTUAL_LOGIN}, expected ${EXPECTED_LOGIN}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Full history so `git show RELEASE_SHA:...` below can find that commit's tree.
          fetch-depth: 0
          # token: is checkout's own input; it sets the git credential every later `git` command uses (git push below).
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify the version files match the branch name
        run: |
          set -euo pipefail
          for path in VERSION ecs-init/ECSVERSION; do
            FILE_VERSION="$(git show "${RELEASE_SHA}:${path}" | tr -d '[:space:]')"
            if [[ "$FILE_VERSION" != "$AGENT_VERSION" ]]; then
              echo "::error::Branch implies version ${AGENT_VERSION}, but ${path} at ${RELEASE_SHA} contains ${FILE_VERSION}"
              exit 1
            fi
          done
          for path in packaging/amazon-linux-ami-integrated/ecs-agent.spec packaging/generic-rpm-integrated/amazon-ecs-init.spec; do
            SPEC_VERSION="$(git show "${RELEASE_SHA}:${path}" | grep -m1 '^Version:' | awk '{print $2}')"
            if [[ "$SPEC_VERSION" != "$AGENT_VERSION" ]]; then
              echo "::error::Branch implies version ${AGENT_VERSION}, but ${path} at ${RELEASE_SHA} has Version: ${SPEC_VERSION}"
              exit 1
            fi
          done

      - name: Check that this version has not already been released
        env:
          # gh reads GH_TOKEN from the environment; it does not use checkout's git credential.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if gh release view "v${AGENT_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Version ${AGENT_VERSION} has already been released (tag v${AGENT_VERSION} exists). If this release needs to be redone, delete the release and tag manually first (see runbook)."
            exit 1
          fi

      # A plain push, never --force. A non-fast-forward rejection here is a
      # deliberate tripwire: it means dev and master have diverged and the
      # release commit is not a descendant of master.
      - name: Fast-forward master to the release commit
        run: |
          set -euo pipefail
          echo "Pushing ${RELEASE_SHA} to master..."
          git push origin "${RELEASE_SHA}:refs/heads/master"

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          git show "${RELEASE_SHA}:CHANGELOG.md" > /tmp/full-changelog.md
          awk -v ver="# ${AGENT_VERSION}" '
            $0 == ver { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' /tmp/full-changelog.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "::error::No CHANGELOG.md section found for version ${AGENT_VERSION}"
            exit 1
          fi

      # This creates the v<version> tag on the release commit and the draft
      # release together, which is the same pairing the release runbook performs
      # by hand in the GitHub web interface. Publishing the draft is a separate,
      # later step and is deliberately not done here.
      - name: Create the release tag and draft the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "v${AGENT_VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${RELEASE_SHA}" \
            --title "Amazon ECS Agent - v${AGENT_VERSION}" \
            --notes-file /tmp/release-notes.md \
            --draft
          echo "Drafted release v${AGENT_VERSION} at ${RELEASE_SHA}"
